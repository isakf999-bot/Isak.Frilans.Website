  <g fill="none" stroke="#ffffff" stroke-width="2.75" stroke-linecap="round">
    <line x1="24" y1="5" x2="24" y2="43"/>
    <ellipse cx="24" cy="24" rx="8.5" ry="19"/>
    <line x1="5" y1="24" x2="43" y2="24"/>
    <line x1="9" y1="14.5" x2="39" y2="14.5"/>
    <line x1="9" y1="33.5" x2="39" y2="33.5"/>
  </g>
</svg>
